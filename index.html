function buildLayout() {
  const positions = new Map();
  const inUnit = new Set();

  // Calculate max gen width first
  let maxGenWidth = 0;
  sortedGens.forEach(gen => {
    const genPeople = generations.get(gen);
    let width = 0;
    const tempInUnit = new Set();

    genPeople.forEach(p => {
      if (tempInUnit.has(p.id)) return;
      const marriages = (marriagesOf.get(p.id) || []).filter(m => {
        const spouseId = m.person1_id === p.id ? m.person2_id : m.person1_id;
        const sp = peopleById.get(spouseId);
        return sp && sp.generation === p.generation && !tempInUnit.has(spouseId);
      });

      if (marriages.length > 0) {
        const spouseIds = marriages.map(m => m.person1_id === p.id ? m.person2_id : m.person1_id);
        const unitWidth = (1 + spouseIds.length) * CARD_W + spouseIds.length * COUPLE_GAP;
        width += unitWidth;
        tempInUnit.add(p.id);
        spouseIds.forEach(sid => tempInUnit.add(sid));
      }
    });

    genPeople.forEach(p => {
      if (!tempInUnit.has(p.id)) width += CARD_W;
    });

    const unitCount = genPeople.length - [...tempInUnit].length / 2;
    width += Math.max(0, unitCount - 1) * CARD_PAD_X;
    if (width > maxGenWidth) maxGenWidth = width;
  });

  function placeGeneration(genIndex, genPeople) {
    const units = [];

    // Build family units: anchor + spouses
    genPeople.forEach(p => {
      if (inUnit.has(p.id)) return;

      const marriages = (marriagesOf.get(p.id) || []).filter(m => {
        const spouseId = m.person1_id === p.id ? m.person2_id : m.person1_id;
        const sp = peopleById.get(spouseId);
        return sp && sp.generation === p.generation && !inUnit.has(spouseId);
      });

      if (marriages.length > 0) {
        const spouses = marriages.map(m => {
          const spouseId = m.person1_id === p.id ? m.person2_id : m.person1_id;
          return { person: peopleById.get(spouseId), marriage: m };
        });
        const unitWidth = (1 + spouses.length) * CARD_W + spouses.length * COUPLE_GAP;
        units.push({ type: 'family', anchor: p, spouses: spouses, width: unitWidth });
        inUnit.add(p.id);
        spouses.forEach(s => inUnit.add(s.person.id));
      }
    });

    // Singles
    genPeople.forEach(p => {
      if (!inUnit.has(p.id)) {
        units.push({ type: 'single', anchor: p, spouses: [], width: CARD_W });
      }
    });

    const totalWidth = units.reduce((s, u) => s + u.width, 0) + Math.max(0, units.length - 1) * CARD_PAD_X;
    let x = MARGIN_LEFT + Math.max(0, (maxGenWidth - totalWidth) / 2);
    const y = MARGIN_TOP + genIndex * GEN_HEIGHT;

    units.forEach(unit => {
      // Place anchor
      positions.set(unit.anchor.id, { x: x, y: y, person: unit.anchor });

      // Place spouses to the right of anchor
      unit.spouses.forEach((s, i) => {
        const spouseX = x + (i + 1) * (CARD_W + COUPLE_GAP);
        positions.set(s.person.id, { x: spouseX, y: y, person: s.person });
      });

      x += unit.width + CARD_PAD_X;
    });
  }

  sortedGens.forEach((gen, idx) => {
    placeGeneration(idx, generations.get(gen));
  });

  return positions;
}

    const midpoint = marriageMidpoints.get(key);
    if (midpoint) {
      // Only draw once per child (from the first parent encountered)
      if (r.parent_id === Math.min(p1, p2)) {
        fromX = midpoint.x;
        fromY = midpoint.y + CARD_H / 2;
      } else {
        return; // Skip duplicate
      }
    }
  }

  if (fromX === undefined) {
    fromX = parentPos.x + CARD_W / 2;
    fromY = parentPos.y + CARD_H;
  }

  const toX = childPos.x + CARD_W / 2;
  const toY = childPos.y;
  const midY = (fromY + toY) / 2;

  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', `M${fromX},${fromY} C${fromX},${midY} ${toX},${midY} ${toX},${toY}`);
  path.setAttribute('class', 'parent-link');
  g.appendChild(path);
});

// Person cards with dates
positions.forEach((pos, id) => {
  const p = pos.person;
  const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  group.setAttribute('class', 'person-card');
  group.setAttribute('transform', `translate(${pos.x}, ${pos.y})`);

  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('width', CARD_W);
  rect.setAttribute('height', CARD_H);
  rect.setAttribute('class', p.gender === 'M' ? 'male' : p.gender === 'F' ? 'female' : 'unknown');
  group.appendChild(rect);

  const displayName = p.maiden_name
    ? `${p.first_name} ${p.maiden_name}`
    : `${p.first_name} ${p.last_name}`;

  const nameText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  nameText.setAttribute('x', CARD_W / 2);
  nameText.setAttribute('y', 17);
  nameText.setAttribute('text-anchor', 'middle');
  nameText.setAttribute('class', 'person-name');
  nameText.textContent = displayName.length > 24 ? displayName.substring(0, 22) + '...' : displayName;
  group.appendChild(nameText);

  // Birth line
  let nextY = 32;
  if (p.birth_date) {
    const birthText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    birthText.setAttribute('x', CARD_W / 2);
    birthText.setAttribute('y', nextY);
    birthText.setAttribute('text-anchor', 'middle');
    birthText.setAttribute('class', 'person-dates');
    birthText.textContent = '\u2605 ' + formatDate(p.birth_date);
    group.appendChild(birthText);
    nextY += 13;
  }

  // Death line
  if (p.death_date) {
    const deathText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    deathText.setAttribute('x', CARD_W / 2);
    deathText.setAttribute('y', nextY);
    deathText.setAttribute('text-anchor', 'middle');
    deathText.setAttribute('class', 'person-dates');
    deathText.textContent = '\u2020 ' + formatDate(p.death_date);
    group.appendChild(deathText);
    nextY += 13;
  }

  // Birth place (only if room)
  if (p.birth_place && nextY <= 62) {
    const placeText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    placeText.setAttribute('x', CARD_W / 2);
    placeText.setAttribute('y', nextY);
    placeText.setAttribute('text-anchor', 'middle');
    placeText.setAttribute('class', 'person-place');
    const place = p.birth_place.length > 26 ? p.birth_place.substring(0, 24) + '...' : p.birth_place;
    placeText.textContent = place;
    group.appendChild(placeText);
  }

  group.addEventListener('mouseenter', (e) => showTooltip(e, p));
  group.addEventListener('mouseleave', hideTooltip);
  group.addEventListener('mousemove', moveTooltip);
  // Touch support
  group.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    showTooltip({ clientX: touch.clientX, clientY: touch.clientY }, p);
  });

  g.appendChild(group);
});

// Tooltip
const tooltip = document.getElementById('tooltip');

function showTooltip(e, p) {
  const displayName = p.maiden_name
    ? `${p.first_name} ${p.maiden_name} (n\u00e9e ${p.last_name})`
    : `${p.first_name} ${p.last_name}`;

  tooltip.querySelector('.name').textContent = displayName;

  let details = [];
  if (p.birth_date || p.birth_place) {
    let birth = '\u2605 ';
    if (p.birth_date) birth += p.birth_date;
    if (p.birth_place) birth += (p.birth_date ? ', ' : '') + p.birth_place;
    details.push(birth);
  }
  if (p.death_date || p.death_place) {
    let death = '\u2020 ';
    if (p.death_date) death += p.death_date;
    if (p.death_place) death += (p.death_date ? ', ' : '') + p.death_place;
    if (p.death_age) death += ' (' + p.death_age + ' ans)';
    details.push(death);
  }
  if (p.generation !== null && p.generation !== undefined) details.push('G\u00e9n\u00e9ration: ' + p.generation);

  // Per-marriage details
  const marriages = marriagesOf.get(p.id) || [];
  if (marriages.length > 0) {
    marriages.forEach(m => {
      const spouseId = m.person1_id === p.id ? m.person2_id : m.person1_id;
      const sp = peopleById.get(spouseId);
      if (!sp) return;
      const spouseName = sp.first_name + ' ' + sp.last_name;
      const key = m.person1_id + '_' + m.person2_id;
      const kids = marriageChildrenMap.get(key) || [];
      const kidNames = kids.map(cid => {
        const c = peopleById.get(cid);
        return c ? c.first_name : '';
      }).filter(Boolean);

      let line = marriages.length > 1
        ? `Union ${m.marriage_order || '?'}: ${spouseName}`
        : `\u00c9poux/se: ${spouseName}`;
      if (m.marriage_date) line += ' (m. ' + m.marriage_date + ')';
      if (m.marriage_place) line += ', ' + m.marriage_place;
      details.push(line);

      if (kidNames.length > 0) {
        details.push('  \u2192 Enfants: ' + kidNames.join(', '));
      }
    });
  } else {
    // Show children even without marriage
    const allChildren = [];
    (childrenOf.get(p.id) || new Set()).forEach(cid => {
      const c = peopleById.get(cid);
      if (c) allChildren.push(c.first_name);
    });
    if (allChildren.length) details.push('Enfants: ' + allChildren.join(', '));
  }

  if (p.notes) details.push(p.notes);

  const detailEl = tooltip.querySelector('.detail');
  detailEl.textContent = '';
  details.forEach((d, i) => {
    if (i > 0) detailEl.appendChild(document.createElement('br'));
    detailEl.appendChild(document.createTextNode(d));
  });
  tooltip.style.display = 'block';
  moveTooltip(e);
}

function moveTooltip(e) {
  let x = e.clientX + 15;
  let y = e.clientY + 15;
  if (x + 350 > window.innerWidth) x = e.clientX - 365;
  if (y + 250 > window.innerHeight) y = e.clientY - 250;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}

function hideTooltip() {
  tooltip.style.display = 'none';
}

// Dismiss tooltip on touch outside
document.addEventListener('touchstart', (e) => {
  if (!e.target.closest('.person-card')) hideTooltip();
});

// Pan and zoom
let currentTransform = { x: 0, y: 0, k: 1 };
let isPanning = false;
let panStart = { x: 0, y: 0 };

function applyTransform() {
  const mainGroup = document.getElementById('main-group');
  mainGroup.setAttribute('transform',
    `translate(${currentTransform.x}, ${currentTransform.y}) scale(${currentTransform.k})`);
}

svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  currentTransform.x = mx - (mx - currentTransform.x) * delta;
  currentTransform.y = my - (my - currentTransform.y) * delta;
  currentTransform.k *= delta;
  applyTransform();
});

svg.addEventListener('mousedown', (e) => {
  if (e.button === 0) {
    isPanning = true;
    panStart = { x: e.clientX - currentTransform.x, y: e.clientY - currentTransform.y };
    svg.style.cursor = 'grabbing';
  }
});

window.addEventListener('mousemove', (e) => {
  if (isPanning) {
    currentTransform.x = e.clientX - panStart.x;
    currentTransform.y = e.clientY - panStart.y;
    applyTransform();
  }
});

window.addEventListener('mouseup', () => {
  isPanning = false;
  svg.style.cursor = 'grab';
});

svg.style.cursor = 'grab';

// Touch pan
let touchStart = null;
svg.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1 && !e.target.closest('.person-card')) {
    touchStart = { x: e.touches[0].clientX - currentTransform.x, y: e.touches[0].clientY - currentTransform.y };
  }
});
svg.addEventListener('touchmove', (e) => {
  if (touchStart && e.touches.length === 1) {
    e.preventDefault();
    currentTransform.x = e.touches[0].clientX - touchStart.x;
    currentTransform.y = e.touches[0].clientY - touchStart.y;
    applyTransform();
  }
});
svg.addEventListener('touchend', () => { touchStart = null; });

function zoomIn() {
  const rect = svg.getBoundingClientRect();
  const cx = rect.width / 2;
  const cy = rect.height / 2;
  currentTransform.x = cx - (cx - currentTransform.x) * 1.3;
  currentTransform.y = cy - (cy - currentTransform.y) * 1.3;
  currentTransform.k *= 1.3;
  applyTransform();
}

function zoomOut() {
  const rect = svg.getBoundingClientRect();
  const cx = rect.width / 2;
  const cy = rect.height / 2;
  currentTransform.x = cx - (cx - currentTransform.x) * 0.7;
  currentTransform.y = cy - (cy - currentTransform.y) * 0.7;
  currentTransform.k *= 0.7;
  applyTransform();
}

function resetView() {
  currentTransform = { x: 0, y: 0, k: 1 };
  applyTransform();
}

function centerInitialView() {
  const left = Math.max(0, (svgWidth - window.innerWidth) / 2);
  window.scrollTo({ left, top: 0, behavior: 'auto' });
}

resetView();
requestAnimationFrame(centerInitialView);

</script>
